<!DOCTYPE html>
<html>
<head>
    <title>Shopping Order</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:#fff;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#444;
        }

        input[type=text],
        input[type=number]{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        input[type=text]:focus,
        input[type=number]:focus{
            border-color:#2196F3;
            outline:none;
            box-shadow:0 0 6px rgba(33,150,243,0.4);
        }

        input[type=submit]{
            width:100%;
            padding:12px;
            background:#2196F3;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        input[type=submit]:hover{
            background:#1976D2;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>Place Order</h2>

    <form action="insert_order.php" method="POST">

        <label>Customer Name</label>
        <input type="text" name="customer_name" required>

        <label>Product Name</label>
        <input type="text" name="product_name" required>

        <label>Quantity</label>
        <input type="number" name="quantity" min="1" required>

        <label>Price</label>
        <input type="number" name="price" step="0.01" required>

        <input type="submit" value="Place Order">

    </form>

</div>

</body>
</html>
